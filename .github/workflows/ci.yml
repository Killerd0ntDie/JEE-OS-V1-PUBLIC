name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome Lint
        run: npm run lint

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run Test Suite
        run: npm run test
        env:
          NODE_ENV: test
          VITE_FIREBASE_API_KEY: "mock-key-for-tests"
          VITE_FIREBASE_PROJECT_ID: "jeeosv1"

      - name: Build Production Bundles (Client & Server)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: "mock-key-for-build"
          VITE_FIREBASE_PROJECT_ID: "jeeosv1"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7
